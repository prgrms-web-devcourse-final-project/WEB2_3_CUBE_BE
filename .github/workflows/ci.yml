name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x roome/gradlew

      - name: Compile
        run: |
          cd roome
          ./gradlew compileJava compileTestJava

      # 전체 테스트는 외부 인프라(Redis, DB) 및 환경변수 의존으로 러너에서 실행 불가
      # 인프라 없이 도는 도메인 테스트만 선별 실행
      - name: Run domain tests
        run: |
          cd roome
          ./gradlew test \
            --tests "com.roome.domain.payment.*" \
            --tests "com.roome.domain.point.repository.*"
